<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Driveby playback spike</title>
    <style>
      body { margin: 0; background: #111; color: #ddd; font: 12px/1.4 Consolas, monospace; }
      header { padding: 6px 10px; background: #222; }
      #stage { position: relative; width: 960px; height: 540px; background: #000; margin: 8px 10px; }
      #stage > * { position: absolute; inset: 0; width: 960px; height: 540px; object-fit: contain; }
      #log { margin: 0 10px; height: 280px; overflow: auto; white-space: pre-wrap; }
      button { font: inherit; }
    </style>
  </head>
  <body>
    <header><span id="status">starting…</span> <button id="run">Run</button></header>
    <div id="stage"></div>
    <pre id="log"></pre>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
