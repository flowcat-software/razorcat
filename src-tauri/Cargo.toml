[package]
name = "razorcat"
version = "0.1.0"
description = "A small, fast, precise video editor for Windows"
authors = ["Flowcat Software"]
license = "GPL-3.0-or-later"
publish = false
edition = "2021"

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "razorcat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["image-png", "tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-specta = { version = "=2.0.0-rc.25", features = ["derive", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-plugin-single-instance = "=2.4.5"
tauri-plugin-global-shortcut = "=2.4.1"
tauri-plugin-store = "=2.4.5"
tauri-plugin-dialog = "=2.8.0"
# Start with Windows (PLAN 5b.8a), as Vandal's.
tauri-plugin-autostart = "=2.7.0"
# Updates, as Vandal's (updater.rs). Rust only: no webview gets the updater permission. Without
# `zip`: our updates are bare setup .exe files, so zip 4's advisories never reach us.
tauri-plugin-updater = { version = "=2.14.0", default-features = false, features = ["rustls-tls", "system-proxy"] }
# Windows notifications: an update found, an update installed (updater.rs), as Vandal's.
tauri-winrt-notification = "=0.8.1"
# WebView2's ProcessFailed (webview_crash.rs): the version wry uses, so nothing new is built.
webview2-com = "=0.39.1"
windows = { version = "0.62", features = ["Foundation", "UI_ViewManagement", "Win32_Foundation", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Media_Audio", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Kernel", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Performance", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Variant", "Win32_UI_HiDpi", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell_PropertiesSystem", "Win32_UI_WindowsAndMessaging"] }

[profile.dev]
opt-level = 1

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
# Function names and lines in the .pdb (not the exe), so a crash dump's stack names them;
# build:local keeps the .pdb beside the installer, never shipped.
debug = "line-tables-only"
strip = "none"
